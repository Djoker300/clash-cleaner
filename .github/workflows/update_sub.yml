name: Auto Update Clash Subscription

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

# Явно задаем права боту на запись содержимого в репозиторий
permissions:
  contents: write

jobs:
  update-subscription:
    runs-on: ubuntu-latest

    steps:
      - name: Чтение файлов репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка необходимых библиотек
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Запуск скрипта очистки и проверки
        run: |
          python cleaner.py

      - name: Сохранение и отправка изменений
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add config.yaml
          if git diff --staged --quiet; then
            echo "Изменений нет, коммит не требуется."
          else
            git commit -m "Auto-update cleaned subscription"
            git push
          fi
