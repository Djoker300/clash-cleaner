name: Auto Update Clash Subscription

on:
  schedule:
    # Автозапуск каждые 12 часов (в 00:00 и 12:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Позволяет запускать процесс вручную через кнопку на GitHub

jobs:
  update-subscription:
    runs-on: ubuntu-latest

    steps:
      - name: Чтение файлов репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка необходимых библиотек
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Запуск скрипта очистки и проверки
        run: |
          python cleaner.py

      - name: Сохранение обновленного config.yaml в репозиторий
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add config.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update cleaned subscription" && git push)
